<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="glideOS">
<meta name="theme-color" content="#0a0a0a">
<title>glideOS</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a;
  --bg2: #111;
  --bg3: #181818;
  --surface: #1c1c1c;
  --border: #2a2a2a;
  --text: #f0f0f0;
  --text2: #777;
  --text3: #444;
  --acc: #22c55e;
  --acc-dim: rgba(34,197,94,0.12);
  --acc-glow: rgba(34,197,94,0.3);
  --red: #ef5350;
  --blue: #38bdf8;
  --yellow: #fbbf24;
  --radius: 14px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; height: -webkit-fill-available; }
body {
  height: 100%; height: -webkit-fill-available;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
html, body, #app { width: 100%; height: 100dvh !important; min-height: 100dvh !important; }
body { overflow-x: hidden !important; overflow-y: auto !important; }
#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  padding-top: var(--safe-top);
  overflow: hidden;
  position: relative;
}
#screen-home {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.home-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.home-bg-canvas { width: 100%; height: 100%; }
.home-content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  padding: calc(var(--safe-top) + 40px) 20px calc(30px + var(--safe-bot));
}
.home-header { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 40px; }
.home-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(64px, 18vw, 96px);
  letter-spacing: 0.08em;
  line-height: 0.88;
  color: #fff;
  margin-bottom: 14px;
}
.home-logo span { color: var(--acc); }
.home-tagline {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text2);
}
.home-cards { display: flex; flex-direction: column; gap: 10px; padding-bottom: 16px; }
.mode-card {
  background: rgba(28,28,28,0.85);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px 18px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  transition: border-color 0.18s, transform 0.12s;
  -webkit-appearance: none;
  appearance: none;
  text-align: left;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 16px;
  text-decoration: none;
  color: inherit;
}
.mode-card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; opacity: 0; transition: opacity 0.18s; }
.mode-card:active { transform: scale(0.985); }
.mode-card.flight-mode::before { background: radial-gradient(circle at 20% 50%, rgba(34,197,94,0.08) 0%, transparent 70%); }
.mode-card.track-mode::before  { background: radial-gradient(circle at 20% 50%, rgba(56,189,248,0.08) 0%, transparent 70%); }
.mode-card:active::before { opacity: 1; }
.mode-card-icon {
  width: 52px; height: 52px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex-shrink: 0;
}
.flight-mode .mode-card-icon { background: var(--acc-dim); border: 1px solid rgba(34,197,94,0.25); }
.track-mode .mode-card-icon  { background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.25); }
.mode-card-body { flex: 1; min-width: 0; }
.mode-card-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 0.1em; line-height: 1; margin-bottom: 4px; }
.flight-mode .mode-card-title { color: var(--acc); }
.track-mode  .mode-card-title { color: var(--blue); }
.mode-card-sub { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.12em; color: var(--text2); line-height: 1.7; }
.mode-card-arrow { font-size: 20px; color: var(--text3); flex-shrink: 0; }
.home-footer { text-align: center; font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.15em; color: var(--text3); padding-top: 6px; }
</style>
</head>
<body>
<div id="app">
  <div id="screen-home">
    <div class="home-bg"><canvas class="home-bg-canvas" id="home-canvas"></canvas></div>
    <div class="home-content">
      <div class="home-header">
        <div class="home-logo">glide<span>OS</span></div>
        <div class="home-tagline">soaring intelligence · v2</div>
      </div>
      <div class="home-cards">
        <a class="mode-card flight-mode" href="flight.html">
          <div class="mode-card-icon">◉</div>
          <div class="mode-card-body">
            <div class="mode-card-title">Mein Flug</div>
            <div class="mode-card-sub">GPS · Vario · Karte · IGC Export<br>OGN Tracking · TikTok · Story</div>
          </div>
          <div class="mode-card-arrow">›</div>
        </a>
        <a class="mode-card track-mode" href="tracker.html">
          <div class="mode-card-icon">◈</div>
          <div class="mode-card-body">
            <div class="mode-card-title">Glider Tracken</div>
            <div class="mode-card-sub">OGN Live · Höhe · Speed · Vario<br>Registrierung oder Wettbewerbs-ID</div>
          </div>
          <div class="mode-card-arrow">›</div>
        </a>
      </div>
      <div class="home-footer">glideOS · open-source soaring tools</div>
    </div>
  </div>
</div>
<script>
(function() {
  const canvas = document.getElementById('home-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  let W, H, dots = [];
  function resize() { W = canvas.width = canvas.offsetWidth * devicePixelRatio; H = canvas.height = canvas.offsetHeight * devicePixelRatio; }
  function initDots() {
    dots = Array.from({ length: 55 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.5 + 0.4, vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4, alpha: Math.random() * 0.5 + 0.1 }));
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    dots.forEach(d => {
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0) d.x = W; if (d.x > W) d.x = 0;
      if (d.y < 0) d.y = H; if (d.y > H) d.y = 0;
      ctx.beginPath(); ctx.arc(d.x, d.y, d.r * devicePixelRatio, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(34,197,94,${d.alpha})`; ctx.fill();
    });
    for (let i = 0; i < dots.length; i++) {
      for (let j = i + 1; j < dots.length; j++) {
        const dx = dots[i].x - dots[j].x, dy = dots[i].y - dots[j].y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < W * 0.14) {
          ctx.beginPath(); ctx.moveTo(dots[i].x, dots[i].y); ctx.lineTo(dots[j].x, dots[j].y);
          ctx.strokeStyle = `rgba(34,197,94,${0.06 * (1 - dist / (W * 0.14))})`; ctx.lineWidth = devicePixelRatio * 0.5; ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  window.addEventListener('resize', () => { resize(); initDots(); });
  resize(); initDots(); draw();
})();
</script>
</body>
</html>
