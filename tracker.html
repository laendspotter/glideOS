<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="glideOS · Track">
<meta name="theme-color" content="#0a0a0a">
<title>glideOS · Glider Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0a; --bg2: #111; --bg3: #181818;
  --surface: #1c1c1c; --border: #2a2a2a;
  --text: #f0f0f0; --text2: #777; --text3: #444;
  --acc: #22c55e; --acc-dim: rgba(34,197,94,0.12); --acc-glow: rgba(34,197,94,0.3);
  --red: #ef5350; --blue: #38bdf8; --yellow: #fbbf24;
  --radius: 14px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; height: -webkit-fill-available; }
body {
  height: 100%; height: -webkit-fill-available;
  background: var(--bg); color: var(--text);
  font-family: 'Inter', sans-serif; overflow: hidden;
  -webkit-font-smoothing: antialiased; overscroll-behavior: none;
}
button, select { font: inherit; }
html, body, #app { width: 100%; height: 100dvh !important; min-height: 100dvh !important; }
body { overflow-x: hidden !important; overflow-y: auto !important; }
#app {
  display: flex; flex-direction: column;
  height: 100dvh; padding-top: var(--safe-top);
  overflow: hidden;
}
.back-btn {
  background: none; border: 1px solid var(--border); border-radius: 999px;
  padding: 5px 12px; color: var(--text2);
  font-family: 'DM Mono', monospace; font-size: 9px;
  letter-spacing: 0.1em; text-transform: uppercase;
  cursor: pointer; flex-shrink: 0; text-decoration: none;
  display: inline-flex; align-items: center;
}
.back-btn:active { background: var(--surface); }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
/* Leaflet dark */
.leaflet-popup-content-wrapper {
  background: var(--surface) !important; border: 1px solid var(--border) !important;
  border-radius: 12px !important; box-shadow: 0 8px 32px rgba(0,0,0,0.6) !important;
  padding: 0 !important; overflow: hidden;
}
.leaflet-popup-content { margin: 0 !important; color: var(--text) !important; }
.leaflet-popup-tip-container { display: none !important; }
.leaflet-container { background: #111 !important; }
.leaflet-tile { filter: brightness(0.72) saturate(0.65) !important; }
/* Toast */
#toast {
  position: fixed; bottom: calc(var(--safe-bot) + 90px); left: 50%;
  transform: translateX(-50%); background: var(--surface);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 9px 18px; font-family: 'DM Mono', monospace; font-size: 10px;
  color: var(--text); letter-spacing: 0.07em; z-index: 9999;
  pointer-events: none; opacity: 0; transition: opacity 0.25s; white-space: nowrap;
}
#toast.show { opacity: 1; }
/* Tracker */
#tracker-topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px 8px; flex-shrink: 0;
  background: var(--bg); border-bottom: 1px solid var(--border);
}
.tracker-logo { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.15em; color: var(--text); flex: 1; }
.tracker-logo span { color: var(--blue); }
.ws-badge {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px; border-radius: 999px;
  border: 1px solid var(--border);
  font-family: 'DM Mono', monospace; font-size: 9px;
  letter-spacing: 0.1em; color: var(--text2); background: var(--surface);
}
.ws-badge .ws-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); flex-shrink: 0; transition: background 0.3s; }
.ws-badge.live .ws-dot { background: var(--blue); box-shadow: 0 0 6px rgba(56,189,248,0.5); animation: blink 2s infinite; }
.ws-badge.live { border-color: rgba(56,189,248,0.4); color: var(--blue); }
.ws-badge.err .ws-dot { background: var(--red); }
.ws-badge.err { border-color: rgba(239,83,80,0.4); color: var(--red); }
#tracker-body { display: flex; flex: 1 1 auto; min-height: 0; overflow: hidden; flex-direction: column; }
#tracker-map-wrap { flex: 1 1 auto; min-height: 0; position: relative; }
#tracker-map { position: absolute; inset: 0; background: #111; }
#tracker-sheet {
  flex-shrink: 0; background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column;
  max-height: 50vh; min-height: 0;
}
.sheet-handle {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px 8px; border-bottom: 1px solid var(--border);
  flex-shrink: 0; cursor: pointer; min-height: 42px;
}
.sheet-handle-title { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text2); }
.sheet-toggle { font-size: 11px; color: var(--text3); }
.sheet-collapsed #tracker-list { display: none; }
.sheet-collapsed #tracker-input-row { display: none; }
.sheet-collapsed { max-height: unset; }
#tracker-input-row { display: flex; gap: 8px; padding: 10px 14px 8px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
.tracker-input {
  flex: 1; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text);
  font-family: 'DM Mono', monospace; font-size: 12px;
  letter-spacing: 0.08em; padding: 8px 10px; outline: none; text-transform: uppercase;
}
.tracker-input:focus { border-color: var(--blue); }
.tracker-input::placeholder { color: var(--text3); }
.tracker-add-btn {
  background: var(--blue); color: #000; border: none; border-radius: 8px;
  width: 38px; height: 38px; font-size: 20px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
#tracker-list {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
  padding: 8px 14px calc(8px + var(--safe-bot));
  display: flex; flex-direction: column; gap: 7px;
}
.tracker-empty { text-align: center; padding: 20px 0; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text3); letter-spacing: 0.1em; line-height: 2; }
.glider-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 12px;
  position: relative; overflow: hidden; cursor: pointer;
  transition: border-color 0.15s; flex-shrink: 0;
}
.glider-card::before { content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%; border-radius: 2px 0 0 2px; }
.glider-card.has-fix::before { background: var(--blue); }
.glider-card.no-fix::before  { background: var(--text3); }
.glider-card.not-found::before { background: var(--yellow); }
.glider-card.selected {
  border-color: var(--card-color, var(--blue));
  box-shadow: 0 0 0 1px var(--card-color, var(--blue)), inset 0 0 0 1px rgba(255,255,255,0.04);
  background: color-mix(in srgb, var(--surface) 90%, var(--card-color, var(--blue)) 10%);
}
.glider-card:active { opacity: 0.85; }
.gc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
.gc-reg { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 0.08em; color: var(--blue); }
.gc-cn { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text2); background: var(--bg3); padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
.gc-model { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text3); font-style: italic; margin-bottom: 5px; }
.gc-remove { background: none; border: none; color: var(--text3); font-size: 12px; cursor: pointer; padding: 4px 4px 4px 8px; line-height: 1; }
.gc-remove:hover { color: var(--red); }
.gc-status { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 0.08em; }
.gc-status.waiting { color: var(--text3); }
.gc-status.no-db   { color: var(--yellow); }
.gc-live { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; overflow: visible; }
.gc-live-item { text-align: center; background: var(--bg3); border-radius: 7px; padding: 6px 4px; min-width: 0; }
.gc-live-lbl { font-family: 'DM Mono', monospace; font-size: 6px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); }
.gc-live-val { font-family: 'Bebas Neue', sans-serif; font-size: 20px; line-height: 1.1; color: var(--text); }
.gc-live-val.up   { color: var(--acc); }
.gc-live-val.down { color: var(--blue); }
.gc-age { font-family: 'DM Mono', monospace; font-size: 8px; color: var(--text3); text-align: right; margin-top: 4px; }
.gc-focus {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 5px; padding: 4px 8px;
  background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.25);
  border-radius: 6px; color: var(--blue);
  font-family: 'DM Mono', monospace; font-size: 8px; letter-spacing: 0.1em;
  cursor: pointer; text-transform: uppercase;
}
::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>
<div id="app">
  <div id="tracker-topbar">
    <a class="back-btn" href="index.html">← HOME</a>
    <div class="tracker-logo">glide<span>TRACK</span></div>
    <div class="ws-badge" id="ws-badge">
      <div class="ws-dot"></div>
      <span id="ws-label">OFFLINE</span>
    </div>
  </div>
  <div id="tracker-body">
    <div id="tracker-map-wrap">
      <div id="tracker-map"></div>
    </div>
    <div id="tracker-sheet">
      <div class="sheet-handle" onclick="toggleSheet()">
        <span class="sheet-handle-title">Flugzeuge (<span id="sheet-count">0</span>)</span>
        <span class="sheet-toggle" id="sheet-toggle">▾</span>
      </div>
      <div id="tracker-input-row">
        <input class="tracker-input" id="tracker-reg-input" placeholder="D-KXXX · WA · Hex-ID" maxlength="8" onkeydown="if(event.key==='Enter') addGlider()" />
        <button class="tracker-add-btn" onclick="addGlider()">+</button>
      </div>
      <div id="tracker-list">
        <div class="tracker-empty" id="tracker-empty">Kennzeichen oben eingeben<br>— z.B. D-KXXX oder WA —</div>
      </div>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
let WS_URL = '';
fetch('/api/config').then(r => r.json()).then(d => {
  WS_URL = d.wsUrl || '';
  connectWS();
}).catch(() => { WS_URL = ''; });

const TRACKER_KEY = 'glideos_tracker_regs';
let trackerRegs = [];
let trackerPositions = {};
let trackerResolved = [];
let ws = null;
let wsStatus = 'disconnected';
let wsReconnectTimer = null;
let trackerMapReady = false;
let trackerMap = null;
let trackerMarkers = {};
let sheetCollapsed = false;
let selectedGliderHex = null;

const GLIDER_COLORS = ['#38bdf8','#22c55e','#fbbf24','#ef5350','#a78bfa','#f472b6'];

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast.tm);
  showToast.tm = setTimeout(() => t.classList.remove('show'), 2400);
}

function loadTrackerRegs() {
  try { trackerRegs = JSON.parse(localStorage.getItem(TRACKER_KEY) || '[]'); }
  catch(e) { trackerRegs = []; }
}
function saveTrackerRegs() {
  try { localStorage.setItem(TRACKER_KEY, JSON.stringify(trackerRegs)); } catch(e) {}
}

function connectWS() {
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  clearTimeout(wsReconnectTimer);
  if (!WS_URL || WS_URL.includes('YOUR-BACKEND')) {
    setWsBadge('err', 'NO URL'); showToast('WS_URL nicht konfiguriert'); return;
  }
  setWsBadge('connecting', 'VERBINDE');
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    wsStatus = 'connected'; setWsBadge('live', 'LIVE');
    if (trackerRegs.length > 0) ws.send(JSON.stringify({ type: 'subscribe', registrations: trackerRegs }));
  };
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'position') handlePositionUpdate(msg.data);
      else if (msg.type === 'subscribed') { trackerResolved = msg.resolved || []; renderTrackerList(); }
    } catch(err) {}
  };
  ws.onclose = () => { wsStatus = 'disconnected'; setWsBadge('', 'OFFLINE'); wsReconnectTimer = setTimeout(connectWS, 4000); };
  ws.onerror = () => { wsStatus = 'error'; setWsBadge('err', 'FEHLER'); };
}

function setWsBadge(cls, label) {
  const badge = document.getElementById('ws-badge');
  const lbl = document.getElementById('ws-label');
  if (!badge || !lbl) return;
  badge.className = 'ws-badge' + (cls ? ' ' + cls : '');
  lbl.textContent = label;
}

function resubscribe() {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'subscribe', registrations: trackerRegs }));
}

function addGlider() {
  const input = document.getElementById('tracker-reg-input');
  const val = (input.value || '').trim().toUpperCase();
  if (!val) return;
  if (trackerRegs.includes(val)) { showToast('Schon dabei'); input.value = ''; return; }
  trackerRegs.push(val);
  saveTrackerRegs();
  input.value = '';
  renderTrackerList();
  resubscribe();
}

function removeGlider(reg) {
  trackerRegs = trackerRegs.filter(r => r !== reg);
  saveTrackerRegs();
  const resolved = trackerResolved.find(d => d.registration === reg);
  if (resolved?.hexId) {
    const m = trackerMarkers[resolved.hexId];
    if (m) {
      if (trackerMapReady) { if (m.marker) trackerMap.removeLayer(m.marker); if (m.line) trackerMap.removeLayer(m.line); }
      delete trackerMarkers[resolved.hexId];
    }
    delete trackerPositions[resolved.hexId];
    if (selectedGliderHex === resolved.hexId) selectedGliderHex = null;
  }
  resubscribe();
  renderTrackerList();
}

function handlePositionUpdate(pos) {
  if (!pos || !pos.hexId) return;
  if (Date.now() - pos.ts > 5 * 60 * 1000) return;
  trackerPositions[pos.hexId] = pos;
  if (!trackerMapReady) return;
  const colorIdx = Object.keys(trackerMarkers).indexOf(pos.hexId);
  const color = GLIDER_COLORS[colorIdx >= 0 ? colorIdx % GLIDER_COLORS.length : Object.keys(trackerMarkers).length % GLIDER_COLORS.length];
  if (!trackerMarkers[pos.hexId]) {
    const line = L.polyline([], { color, weight: 2, opacity: 0.7, dashArray: '4 4' }).addTo(trackerMap);
    const icon = createGliderIcon(pos.course || 0, color);
    const marker = L.marker([pos.lat, pos.lon], { icon })
      .addTo(trackerMap)
      .bindPopup(() => buildPopupContent(pos.hexId), { className: 'glide-popup', closeButton: false, maxWidth: 220 });
    marker.on('click', () => selectGlider(pos.hexId));
    trackerMarkers[pos.hexId] = { marker, line, latLngs: [[pos.lat, pos.lon]], color };
  } else {
    const m = trackerMarkers[pos.hexId];
    m.marker.setLatLng([pos.lat, pos.lon]);
    m.marker.setIcon(createGliderIcon(pos.course || 0, m.color));
    m.latLngs.push([pos.lat, pos.lon]);
    if (m.latLngs.length > 300) m.latLngs.shift();
    m.line.setLatLngs(m.latLngs);
    if (m.marker.isPopupOpen()) m.marker.getPopup().setContent(buildPopupContent(pos.hexId));
  }
  renderTrackerList();
}

function selectGlider(hexId) {
  selectedGliderHex = hexId;
  renderTrackerList();
  const pos = trackerPositions[hexId];
  if (pos && trackerMapReady) trackerMap.panTo([pos.lat, pos.lon], { animate: true, duration: 0.5 });
}

function buildPopupContent(hexId) {
  const pos = trackerPositions[hexId];
  if (!pos) return '<div style="padding:12px;font-family:monospace;color:#777">Kein Fix</div>';
  const age = Math.round((Date.now() - pos.ts) / 1000);
  const ageStr = age < 60 ? `${age}s` : `${Math.round(age/60)}min`;
  return `
    <div style="padding:12px 14px;min-width:170px">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:17px;color:#38bdf8;border-bottom:1px solid #2a2a2a;padding-bottom:5px;margin-bottom:7px;display:flex;align-items:center;gap:6px">
        ${pos.registration || hexId}
        ${pos.cn ? `<span style="font-family:'DM Mono',monospace;font-size:10px;color:#555;background:#181818;padding:2px 6px;border-radius:4px">${pos.cn}</span>` : ''}
      </div>
      ${pos.model ? `<div style="font-family:'DM Mono',monospace;color:#444;font-size:9px;margin-bottom:7px;font-style:italic">${pos.model}</div>` : ''}
      <div style="display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-family:'DM Mono',monospace;font-size:10px;align-items:center">
        <span style="color:#555">Höhe</span><span style="color:#f0f0f0;text-align:right;font-family:'Bebas Neue',sans-serif;font-size:14px">${pos.altM != null ? pos.altM + ' m' : '—'}</span>
        <span style="color:#555">Speed</span><span style="color:#f0f0f0;text-align:right;font-family:'Bebas Neue',sans-serif;font-size:14px">${pos.speedKmh != null ? pos.speedKmh + ' km/h' : '—'}</span>
        <span style="color:#555">Kurs</span><span style="color:#f0f0f0;text-align:right;font-family:'Bebas Neue',sans-serif;font-size:14px">${pos.course != null ? pos.course + '°' : '—'}</span>
        ${pos.varioMs != null ? `<span style="color:#555">Vario</span><span style="color:${pos.varioMs > 0 ? '#22c55e' : '#38bdf8'};text-align:right;font-family:'Bebas Neue',sans-serif;font-size:14px">${pos.varioMs > 0 ? '+' : ''}${pos.varioMs} m/s</span>` : ''}
        <span style="color:#333">vor</span><span style="color:#333;text-align:right">${ageStr}</span>
      </div>
    </div>
  `;
}

function createGliderIcon(course, color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
    <g transform="rotate(${course},20,20)">
      <ellipse cx="20" cy="20" rx="3" ry="12" fill="${color}" stroke="#000" stroke-width="1.2"/>
      <ellipse cx="20" cy="20" rx="16" ry="2.5" fill="${color}" stroke="#000" stroke-width="1.2"/>
      <ellipse cx="20" cy="30" rx="7" ry="1.5" fill="${color}" stroke="#000" stroke-width="1.2"/>
    </g>
  </svg>`;
  return L.divIcon({ html: svg, className: '', iconSize: [40, 40], iconAnchor: [20, 20], popupAnchor: [0, -22] });
}

function focusGlider(hexId) {
  selectGlider(hexId);
  const pos = trackerPositions[hexId];
  if (!pos || !trackerMapReady) return;
  trackerMap.flyTo([pos.lat, pos.lon], 13, { duration: 0.8 });
  const m = trackerMarkers[hexId];
  if (m && m.marker) m.marker.openPopup();
}

function renderTrackerList() {
  const list = document.getElementById('tracker-list');
  const empty = document.getElementById('tracker-empty');
  const count = document.getElementById('sheet-count');
  if (!list) return;
  count.textContent = trackerRegs.length;
  if (trackerRegs.length === 0) {
    empty.style.display = '';
    list.querySelectorAll('.glider-card').forEach(el => el.remove());
    return;
  }
  empty.style.display = 'none';
  list.querySelectorAll('.glider-card').forEach(el => el.remove());
  trackerRegs.forEach((reg, i) => {
    const color = GLIDER_COLORS[i % GLIDER_COLORS.length];
    const resolved = trackerResolved.find(d => d.registration === reg || (d.info?.cn || '').toUpperCase() === reg);
    const hexId = resolved?.hexId;
    const info = resolved?.info;
    const pos = hexId ? trackerPositions[hexId] : null;
    const age = pos ? Math.round((Date.now() - pos.ts) / 1000) : null;
    const isSelected = hexId && selectedGliderHex === hexId;
    const card = document.createElement('div');
    card.className = 'glider-card ' + (pos ? 'has-fix' : hexId ? 'no-fix' : 'not-found') + (isSelected ? ' selected' : '');
    card.style.setProperty('--card-color', color);
    if (hexId) card.addEventListener('click', (e) => { if (!e.target.closest('.gc-remove') && !e.target.closest('.gc-focus')) selectGlider(hexId); });
    let liveHtml = '';
    if (!hexId) {
      liveHtml = `<div class="gc-status no-db">Nicht in OGN DB</div>`;
    } else if (!pos) {
      liveHtml = `<div class="gc-status waiting">Warte auf Signal…</div>`;
    } else {
      const vCol = pos.varioMs != null ? (pos.varioMs > 0.3 ? 'up' : pos.varioMs < -0.3 ? 'down' : '') : '';
      liveHtml = `
        <div class="gc-live">
          <div class="gc-live-item"><div class="gc-live-lbl">Höhe</div><div class="gc-live-val">${pos.altM != null ? pos.altM : '—'}</div></div>
          <div class="gc-live-item"><div class="gc-live-lbl">km/h</div><div class="gc-live-val">${pos.speedKmh != null ? pos.speedKmh : '—'}</div></div>
          <div class="gc-live-item"><div class="gc-live-lbl">Vario</div><div class="gc-live-val ${vCol}">${pos.varioMs != null ? (pos.varioMs > 0 ? '+' : '') + pos.varioMs : '—'}</div></div>
        </div>
        <div class="gc-age">vor ${age < 60 ? age + 's' : Math.round(age/60) + 'min'}</div>
        <button class="gc-focus" onclick="focusGlider('${hexId}')">◎ KARTE</button>
      `;
    }
    card.innerHTML = `
      <div class="gc-top">
        <div>
          <span class="gc-reg" style="color:${color}">${reg}</span>
          ${info?.cn && info.cn !== reg ? `<span class="gc-cn">${info.cn}</span>` : ''}
        </div>
        <button class="gc-remove" onclick="removeGlider('${reg}')" title="Entfernen">✕</button>
      </div>
      ${info?.model ? `<div class="gc-model">${info.model}</div>` : ''}
      ${liveHtml}
    `;
    list.appendChild(card);
  });
}

function toggleSheet() {
  sheetCollapsed = !sheetCollapsed;
  document.getElementById('tracker-sheet').classList.toggle('sheet-collapsed', sheetCollapsed);
  document.getElementById('sheet-toggle').textContent = sheetCollapsed ? '▴' : '▾';
  setTimeout(() => { if (trackerMapReady && trackerMap) trackerMap.invalidateSize(); }, 200);
}

setInterval(() => renderTrackerList(), 5000);

function initTrackerMap() {
  if (trackerMapReady || typeof L === 'undefined') return;
  const el = document.getElementById('tracker-map');
  if (!el) return;
  trackerMap = L.map(el, { zoomControl: true, attributionControl: false, dragging: true, tap: true, scrollWheelZoom: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, crossOrigin: true }).addTo(trackerMap);
  trackerMap.setView([48.5, 9.0], 8);
  trackerMap.on('click', () => { selectedGliderHex = null; renderTrackerList(); });
  trackerMapReady = true;
  setTimeout(() => trackerMap.invalidateSize(), 300);
}

window.onload = () => {
  loadTrackerRegs();
  renderTrackerList();
  initTrackerMap();
};
</script>
</body>
</html>
